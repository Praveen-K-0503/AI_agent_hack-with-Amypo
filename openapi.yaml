openapi: 3.1.0
info:
  title: Autonomous AI Agent Safety & Permission Control System
  description: Local middleware firewall intercepting agent actions, scoring risk,
    and enforcing policy.
  version: 1.0.0
paths:
  /api/v1/operator/login:
    post:
      tags:
      - Operator
      summary: Login Operator
      operationId: login_operator_api_v1_operator_login_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_login_operator_api_v1_operator_login_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorLoginResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/operator/logout:
    post:
      tags:
      - Operator
      summary: Logout Operator
      operationId: logout_operator_api_v1_operator_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - OAuth2PasswordBearer: []
  /api/v1/operator/me:
    get:
      tags:
      - Operator
      summary: Get Operator Me
      operationId: get_operator_me_api_v1_operator_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - OAuth2PasswordBearer: []
  /api/v1/agents/:
    get:
      tags:
      - Agent Management
      summary: List Agents
      operationId: list_agents_api_v1_agents__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AgentInfo'
                type: array
                title: Response List Agents Api V1 Agents  Get
      security:
      - OAuth2PasswordBearer: []
  /api/v1/agents/{agent_id}:
    get:
      tags:
      - Agent Management
      summary: Get Agent
      operationId: get_agent_api_v1_agents__agent_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentInfo'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agents/{agent_id}/status:
    patch:
      tags:
      - Agent Management
      summary: Update Agent Status
      operationId: update_agent_status_api_v1_agents__agent_id__status_patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentStatusUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agents/{agent_id}/rotate-key:
    post:
      tags:
      - Agent Management
      summary: Rotate Agent Key
      operationId: rotate_agent_key_api_v1_agents__agent_id__rotate_key_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agents/{agent_id}/quarantine:
    post:
      tags:
      - Agent Management
      summary: Quarantine Agent
      description: Quarantine an agent and revoke all its active credentials, linking
        to an incident.
      operationId: quarantine_agent_api_v1_agents__agent_id__quarantine_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          title: Agent Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              title: Payload
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/models:
    get:
      tags:
      - Model Governance
      summary: List Models
      description: List all registered models.
      operationId: list_models_api_v1_models_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  type: object
                type: array
                title: Response List Models Api V1 Models Get
      security:
      - OAuth2PasswordBearer: []
  /api/v1/models/health:
    get:
      tags:
      - Model Governance
      summary: Get Model Health
      description: Retrieve runtime model health status and data drift statistics.
      operationId: get_model_health_api_v1_models_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Get Model Health Api V1 Models Health Get
      security:
      - OAuth2PasswordBearer: []
  /api/v1/models/{model_version}:
    get:
      tags:
      - Model Governance
      summary: Get Model Details
      description: Retrieve details of a registered model.
      operationId: get_model_details_api_v1_models__model_version__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: model_version
        in: path
        required: true
        schema:
          type: string
          title: Model Version
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Get Model Details Api V1 Models  Model Version  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/models/{model_version}/activate:
    post:
      tags:
      - Model Governance
      summary: Activate Model
      description: Activate a model version atomically.
      operationId: activate_model_api_v1_models__model_version__activate_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: model_version
        in: path
        required: true
        schema:
          type: string
          title: Model Version
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Activate Model Api V1 Models  Model Version  Activate
                  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/models/rollback:
    post:
      tags:
      - Model Governance
      summary: Rollback Model
      description: Rollback to the most recently active/retired compatible model.
      operationId: rollback_model_api_v1_models_rollback_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Rollback Model Api V1 Models Rollback Post
      security:
      - OAuth2PasswordBearer: []
  /api/v1/models/emergency-retire:
    post:
      tags:
      - Model Governance
      summary: Emergency Retire
      description: Immediately retire the active model and fallback to known-good
        or lockdown.
      operationId: emergency_retire_api_v1_models_emergency_retire_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Emergency Retire Api V1 Models Emergency Retire Post
      security:
      - OAuth2PasswordBearer: []
  /api/v1/security/lockdown:
    post:
      tags:
      - Security Operations
      summary: Trigger Lockdown
      description: Trigger a global system lockdown. Fails closed all evaluate-action
        operations.
      operationId: trigger_lockdown_api_v1_security_lockdown_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Trigger Lockdown Api V1 Security Lockdown Post
      security:
      - OAuth2PasswordBearer: []
  /api/v1/security/unlock:
    post:
      tags:
      - Security Operations
      summary: Release Lockdown
      description: Release system lockdown and restore normal safety checks.
      operationId: release_lockdown_api_v1_security_unlock_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Release Lockdown Api V1 Security Unlock Post
      security:
      - OAuth2PasswordBearer: []
  /api/v1/security/status:
    get:
      tags:
      - Security Operations
      summary: Get Lockdown Status
      description: Retrieve the current lockdown state of the security platform.
      operationId: get_lockdown_status_api_v1_security_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Get Lockdown Status Api V1 Security Status Get
      security:
      - OAuth2PasswordBearer: []
  /api/v1/security/audit/verify:
    get:
      tags:
      - Security Operations
      summary: Verify Audit Logs
      description: Verify cryptographic integrity of the security audit log chain.
      operationId: verify_audit_logs_api_v1_security_audit_verify_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Verify Audit Logs Api V1 Security Audit Verify Get
      security:
      - OAuth2PasswordBearer: []
  /api/v1/security/audit/export:
    get:
      tags:
      - Security Operations
      summary: Export Audit Logs
      description: Export paginated compliance-audited security events.
      operationId: export_audit_logs_api_v1_security_audit_export_get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: start_time
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: ISO format start datetime filter
          title: Start Time
        description: ISO format start datetime filter
      - name: end_time
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: ISO format end datetime filter
          title: End Time
        description: ISO format end datetime filter
      - name: severity
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Severity category filter
          title: Severity
        description: Severity category filter
      - name: event_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Event classification filter
          title: Event Type
        description: Event classification filter
      - name: agent_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Target agent filter
          title: Agent Id
        description: Target agent filter
      - name: incident_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Linked incident filter
          title: Incident Id
        description: Linked incident filter
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page index
          default: 1
          title: Page
        description: Page index
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: Items per page
          default: 100
          title: Limit
        description: Items per page
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Export Audit Logs Api V1 Security Audit Export Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/incidents:
    get:
      tags:
      - Incident Response
      summary: List Incidents
      description: Retrieve all logged security incidents.
      operationId: list_incidents_api_v1_incidents_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/IncidentResponse'
                type: array
                title: Response List Incidents Api V1 Incidents Get
      security:
      - OAuth2PasswordBearer: []
    post:
      tags:
      - Incident Response
      summary: Create Incident
      description: Declare a new security operational incident.
      operationId: create_incident_api_v1_incidents_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/incidents/{incident_id}:
    get:
      tags:
      - Incident Response
      summary: Get Incident
      description: Get detail specifications of a single security incident.
      operationId: get_incident_api_v1_incidents__incident_id__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: incident_id
        in: path
        required: true
        schema:
          type: string
          title: Incident Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Incident Response
      summary: Update Incident
      description: Modify details, ownership, or status of an incident.
      operationId: update_incident_api_v1_incidents__incident_id__patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: incident_id
        in: path
        required: true
        schema:
          type: string
          title: Incident Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/incidents/{incident_id}/resolve:
    post:
      tags:
      - Incident Response
      summary: Resolve Incident
      description: Transition an incident state to resolved.
      operationId: resolve_incident_api_v1_incidents__incident_id__resolve_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: incident_id
        in: path
        required: true
        schema:
          type: string
          title: Incident Id
      requestBody:
        content:
          application/json:
            schema:
              type: object
              title: Notes
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/health:
    get:
      summary: Get Health
      operationId: get_health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/readiness:
    get:
      summary: Get Readiness
      operationId: get_readiness_api_v1_readiness_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/metrics:
    get:
      summary: Metrics
      operationId: metrics_api_v1_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/agents/register:
    post:
      summary: Register Agent
      description: 'Register a new AI agent and issue a plaintext API key.


        The plaintext key is returned ONCE.  The caller must store it securely and

        pass it as the X-Agent-Key header on every /evaluate-action call.


        Idempotent: if the agent_id already exists and is already registered (has
        a

        key hash), returns 409 Conflict.


        The assigned role must be one of: ResearchAgent, DeveloperAgent, OperationsAgent.

        The role cannot be changed after registration (Phase 3 will add management
        APIs).'
      operationId: register_agent_api_v1_agents_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRegisterResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/audit-log:
    get:
      summary: Get Audit Log
      operationId: get_audit_log_api_v1_audit_log_get
      parameters:
      - name: agent_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter logs by Agent ID
          title: Agent Id
        description: Filter logs by Agent ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLogItem'
                title: Response Get Audit Log Api V1 Audit Log Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/evaluate-action:
    post:
      summary: Evaluate Action
      description: "Core firewall evaluation endpoint.\n\nPipeline order (Phase 2):\n\
        \    1. Authentication (X-Agent-Key validation) \u2190 NEW\n    2. Rate limiting\
        \ (Redis counter)\n    3. Agent DB get-or-create\n    4. ML Risk Engine (SentenceTransformer\
        \ + XGBoost)\n    5. Policy Engine (RBAC)\n    6. PostgreSQL persistence\n\
        \    7. WebSocket broadcast (if human approval required)\n\nAUTH_ENABLED=true:\n\
        \    - X-Agent-Key is mandatory.\n    - agent_id and role are derived from\
        \ the AUTHENTICATED credential.\n    - Self-reported agent_id in the request\
        \ body is IGNORED for identity.\n      (It is still used to produce useful\
        \ audit log entries; the actual\n       authoritative identity is the credential-bound\
        \ agent.)\n\nAUTH_ENABLED=false (Phase 1 compatibility):\n    - X-Agent-Key\
        \ is optional.\n    - agent_id and role fall back to self-reported + substring\
        \ matching."
      operationId: evaluate_action_api_v1_evaluate_action_post
      parameters:
      - name: X-Agent-Key
        in: header
        required: false
        schema:
          type: string
          title: X-Agent-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionEvaluationRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionEvaluationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/approve-action:
    post:
      summary: Approve Action
      operationId: approve_action_api_v1_approve_action_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalResolutionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResolutionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
  /api/v1/ask:
    post:
      tags:
      - Question Answering & Placement
      summary: Ask a question over AMYPO database & institutional knowledge
      description: Natural language Q&A with mandatory in-line AURA safety evaluation
        and zero-hallucination grounding.
      operationId: ask_question_api_v1_ask_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/placement/students:
    get:
      tags:
      - Question Answering & Placement
      summary: Get all 30 AMYPO students
      description: Returns directory of students with GPA, attendance, verified skills,
        and coding scores.
      operationId: get_students_api_v1_placement_students_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/placement/companies:
    get:
      tags:
      - Question Answering & Placement
      summary: Get all 10 recruiting companies
      description: Returns company hiring criteria, min GPA, min attendance, and required
        tech stacks.
      operationId: get_companies_api_v1_placement_companies_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/placement/match:
    get:
      tags:
      - Question Answering & Placement
      summary: Evaluate placement eligibility with exact mathematical formula
      description: 'Formula: Eligibility = (Normalized GPA * 0.40) + (Skills Match
        % * 0.60). Recommends gap courses if < 60%.'
      operationId: match_placement_api_v1_placement_match_get
      parameters:
      - name: student_id
        in: query
        required: true
        schema:
          type: string
          description: Student ID e.g. STU001
          title: Student Id
        description: Student ID e.g. STU001
      - name: company_id
        in: query
        required: true
        schema:
          type: string
          description: Company ID e.g. CMP001
          title: Company Id
        description: Company ID e.g. CMP001
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacementMatchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/placement/gap-courses:
    get:
      tags:
      - Question Answering & Placement
      summary: Get all available skill gap remediation courses
      description: Lists the hypothetical course catalog used for student skill remediation.
      operationId: get_gap_courses_api_v1_placement_gap_courses_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    ActionEvaluationRequest:
      properties:
        agent_id:
          type: string
          title: Agent Id
          description: Unique identifier for the AI agent
        action:
          type: string
          title: Action
          description: Action name or type being attempted
        parameters:
          type: object
          title: Parameters
          description: Parameters associated with the action
        requested_at:
          type: string
          title: Requested At
          description: ISO-8601 timestamp of the request
      type: object
      required:
      - agent_id
      - action
      - requested_at
      title: ActionEvaluationRequest
    ActionEvaluationResponse:
      properties:
        decision:
          type: string
          title: Decision
